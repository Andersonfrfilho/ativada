name: ${PROJECT_NAME}-${ENV}

services:
  postgres:
    image: postgres:18-alpine
    container_name: ${PROJECT_NAME}-${ENV}-postgres
    restart: unless-stopped
    ports:
      - '127.0.0.1:${POSTGRES_PORT}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: ${PROJECT_NAME}-${ENV}-keycloak
    restart: unless-stopped
    command: ['start-dev', '--import-realm']
    ports:
      - '127.0.0.1:${KEYCLOAK_PORT}:8080'
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?KEYCLOAK_ADMIN_USER ausente}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD ausente}
      KC_HOSTNAME: http://127.0.0.1:${KEYCLOAK_PORT}
      KC_HEALTH_ENABLED: 'true'
      KC_FEATURES: admin-fine-grained-authz:v2
      KEYCLOAK_SESSION_CLIENT_SECRET: ${KEYCLOAK_SESSION_CLIENT_SECRET:?KEYCLOAK_SESSION_CLIENT_SECRET ausente}
      KEYCLOAK_SERVICE_CLIENT_SECRET: ${KEYCLOAK_SERVICE_CLIENT_SECRET:?KEYCLOAK_SERVICE_CLIENT_SECRET ausente}
      KEYCLOAK_PANEL_ORIGIN: ${KEYCLOAK_PANEL_ORIGIN:?KEYCLOAK_PANEL_ORIGIN ausente}
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./realm:/opt/keycloak/data/import:ro
    depends_on:
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.31.4
    container_name: ${PROJECT_NAME}-${ENV}-mailpit
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
    name: ${PROJECT_NAME}-${ENV}-postgres-data
  keycloak-data:
    name: ${PROJECT_NAME}-${ENV}-keycloak-data
